[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spiritbox"
version = "0.2.0"
description = "Automated Presentation Narration System — PPTX to narrated PPSX / YouTube video"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.0",
    "pyyaml>=6.0",
    "anthropic>=1.11.0",
    "google-genai>=2.27.0",
    "Pillow>=10.0.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
    "pypdfium2>=4.30.0",
]

[tool.setuptools.packages.find]
include = ["spiritbox*"]
